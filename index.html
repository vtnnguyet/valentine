<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yes or No?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <img id="questionGif" src="valentine.gif" alt="Valentine Question">
    <h1>Would you be my Valentine?</h1>
    
    <div class="buttons">
        <button id="yesBtn" class="btn yes">Yes</button>
        <button id="noBtn" class="btn no">No</button>
    </div>

    <div id="result">
        <img id="fireworks" src="fireworks.gif" alt="Fireworks">
    </div>

    <script src="script.js"></script>
</body>
</html>
